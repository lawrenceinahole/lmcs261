<!DOCTYPE html>
<body>
    <canvas width="600" height="600" id="canvas" style="width: 600px; height: 600px;"></canvas>
</body>

<script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const w = canvas.width, h = canvas.height;

    const dpr = window.devicePixelRatio || 1;
    canvas.width *= dpr, canvas.height *= dpr;
    ctx.scale(dpr, dpr);

    // circle format: ctx.arc(x, y, radius, startAngle, endAngle, counterclockwise)
    // rectangle format: ctx.fillRect(x, y, width, height)

    let angle = 0;

    function draw(){
        // background
        ctx.fillStyle = "orange";
        ctx.fillRect(0, 0, w, h);

        const cx = w / 2, cy = h / 2;
        const unit = Math.min(w, h);

        // turntable body
        ctx.fillStyle = "brown";
        ctx.fillRect(w * 0.15, h * 0.20, w * 0.70, h * 0.5833);
        ctx.fillStyle = "black";
        ctx.fillRect(w * 0.1917, h * 0.2417, w * 0.6167, h * 0.50);

        // vinyl record
        ctx.beginPath();
        ctx.arc(cx - w * 0.05, cy, unit * 0.1917, 0, Math.PI * 2, false);
        ctx.fillStyle = "#181818";
        ctx.fill();

        // highlight
        ctx.beginPath();
        ctx.arc(cx - w * 0.05, cy, unit * 0.1917, angle, angle + Math.PI, false);
        ctx.strokeStyle = "#484848";
        ctx.lineWidth = unit * 0.0067;
        ctx.stroke();

        // record label
        ctx.beginPath();
        ctx.arc(cx - w * 0.05, cy, unit * 0.0467, 0, Math.PI * 2, false);
        ctx.fillStyle = "orange";
        ctx.fill();


        // center hole
        ctx.beginPath();
        ctx.arc(cx - w * 0.05, cy, unit * 0.01, 0, Math.PI * 2, false);
        ctx.fillStyle = "black";
        ctx.fill();

        // tonearm
        ctx.beginPath();
        ctx.lineTo(w * 0.6083, h * 0.30);
        ctx.lineTo(w * 0.7583, h * 0.30);
        ctx.lineTo(w * 0.70, h * 0.55);
        ctx.lineWidth = unit * 0.02;
        ctx.strokeStyle = "silver";
        ctx.stroke();

        // tonearm base
        ctx.beginPath();
        ctx.arc(w * 0.6083, h * 0.30, unit * 0.0367, 0, Math.PI * 2, false);
        ctx.fillStyle = "white";
        ctx.fill();

        // buttons
        ctx.beginPath();
        ctx.arc(w * 0.25, h * 0.2917, unit * 0.02, 0, Math.PI * 2, false);
        ctx.fillStyle = "red";
        ctx.fill();

        ctx.beginPath();
        ctx.arc(w * 0.3167, h * 0.2917, unit * 0.02, 0, Math.PI * 2, false);
        ctx.fillStyle = "white";
        ctx.fill();
    }

    draw ();


    function tick(){
        
        angle = angle + 0.01;
        draw();
        requestAnimationFrame(tick);
    }
    tick();
</script>
